<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Zapatagium</title>
  <link rel="stylesheet" href="../css/comun.css">
  <link rel="stylesheet" href="../css/04-crear-cuenta.css">
</head>
<body>
  <div class="navbar">
    <a href="01-inicio.html" class="logo-circulo">Z</a>
    <div class="menu">
      <a href="01-inicio.html">Inicio</a>
      <a href="02-sobre-nosotros.html">Sobre nosotros</a>
      <a href="03-iniciar-sesion.html">Iniciar sesión</a>
    </div>
    <div class="usuario"></div>
  </div>

  <div class="banda-titulo"><h1>Crear cuenta</h1></div>

  <div class="contenedor">
    <div class="tarjeta tarjeta-centrada">
      <h2>Registrate</h2>
      <form id="form-registro">
        <div class="dos-columnas">
          <input type="text" id="nombre" placeholder="Nombre">
          <input type="text" id="apellido" placeholder="Apellido">
          <input type="text" id="dni" placeholder="DNI">
          <input type="email" id="email" placeholder="Email">
          <input type="password" id="clave" placeholder="Contraseña">
          <input type="password" id="clave2" placeholder="Repetir contraseña">
        </div>
        <input type="text" id="codigo" placeholder="Código">
        <button type="submit" class="boton boton-ancho">Crear cuenta</button>
      </form>
      <p class="pie-tarjeta">¿Ya tenés cuenta? <a href="03-iniciar-sesion.html" class="enlace">Iniciar sesión</a></p>
    </div>
  </div>

  <div class="footer">
    <p class="footer-marca">ZAPATAGIUM</p>
    <div class="footer-columnas">
      <div><h3>SERVICIO</h3><p>zapatagium@gmail.com</p></div>
      <div><h3>POLÍTICA</h3><a href="06-terminos.html">Términos</a></div>
      <div><h3>REDES</h3><a>Instagram</a></div>
      <div><h3>OTROS</h3><a href="02-sobre-nosotros.html">Nosotros</a></div>
    </div>
    <p class="derechos"><span>2026</span> / Todos los derechos reservados</p>
  </div>

  <script src="../js/comun.js"></script>
  <script src="../js/04-crear-cuenta.js"></script>
</body>
</html>
